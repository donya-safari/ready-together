<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ready Together · Rainbow Leads (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;700;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D2B3A; --muted:#5B6B7C; --paper:#F5F8FB; --card:#FFFFFF; --line:#DCE4EC;
  --sage:#2E6E70; --sage-soft:#E3F0EF; --sky:#DCEBFA;
  --red:#E5484D; --yellow:#F2B33D; --green:#35A05A; --blue:#3E7BE0; --pink:#E06AA8;
  --alert:#B42318; --alert-soft:#FDECEA;
  --monitor:#0E1E22; --trace:#5BE38A;
  --display:"Baloo 2","Vazirmatn",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8EEF4; --muted:#A3B1BF; --paper:#121A22; --card:#1A2530; --line:#2C3A47;
    --sage:#6FC0BC; --sage-soft:#1E3534; --sky:#1C2E42; --alert:#FF8A80; --alert-soft:#3A1D1C;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EEF4; --muted:#A3B1BF; --paper:#121A22; --card:#1A2530; --line:#2C3A47;
  --sage:#6FC0BC; --sage-soft:#1E3534; --sky:#1C2E42; --alert:#FF8A80; --alert-soft:#3A1D1C;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
[dir="rtl"] body{font-family:"Vazirmatn",var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
img,svg{max-width:100%}

.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
@media (min-width:520px){
  body{padding:24px 0}
  .app{min-height:820px;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(29,43,58,.12)}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.lang{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px}
.proto{background:#FFF4D6;color:#6B4E00;font-size:12.5px;padding:6px 18px;text-align:center}
:root[data-theme="dark"] .proto{background:#3A3216;color:#F2D58A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .proto{background:#3A3216;color:#F2D58A}}

main{flex:1;padding:18px 18px 100px;overflow-y:auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 8px}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.block{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--sage);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* home */
.hello{margin:6px 0 18px}
.surgery{display:flex;justify-content:space-between;align-items:center;background:var(--sage);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:18px}
.surgery b{font-family:var(--display);font-size:20px;display:block}
.count{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;text-align:center}
.count small{display:block;font-size:12px;font-family:var(--body);font-weight:400}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:16px 12px;text-align:start}
.role .em{font-size:30px;display:block;margin-bottom:6px}
.role b{font-family:var(--display);font-size:18px;display:block}
.role span{font-size:14px;color:var(--muted)}
.role.kid{border-color:transparent;background:
  linear-gradient(var(--card),var(--card)) padding-box,
  linear-gradient(120deg,var(--red),var(--yellow),var(--green),var(--blue)) border-box;border:2px solid transparent}

/* timeline */
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative;padding:0 0 16px 28px}
[dir="rtl"] .steps li{padding:0 28px 16px 0}
.steps li::before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:-4px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li::after{content:"";position:absolute;inset-inline-start:2px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--sage)}
.steps time{font-weight:700;color:var(--sage);display:block;font-size:14px}
.planner{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.planner input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:18px}
.fast{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fast div{background:var(--sage-soft);border-radius:14px;padding:12px}
.fast b{font-family:var(--display);font-size:24px;display:block}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}

/* kid */
.ages{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.ages button{flex:1;border:none;background:transparent;border-radius:999px;padding:8px 4px;font-size:14px}
.ages button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.stage{display:grid;grid-template-columns:1fr;gap:12px}
.monitor{background:var(--monitor);border-radius:18px;padding:12px 14px;color:#cfe;position:relative}
.monitor canvas{width:100%;height:110px;display:block}
.mon-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#9fb}
.hr{font-family:var(--display);font-weight:800;font-size:34px;color:var(--trace);line-height:1}
.body-wrap{display:flex;gap:12px;align-items:center}
.body-wrap svg{width:150px;flex:none}
.stickers{display:flex;flex-direction:column;gap:8px;flex:1}
.sticker{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:700;text-align:start}
.sticker i{width:22px;height:22px;border-radius:50%;flex:none;border:3px solid rgba(0,0,0,.15)}
.sticker[aria-pressed="true"]{opacity:.55}
.done{background:var(--sage-soft);border-radius:14px;padding:12px;font-weight:700}
.tabs-kid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.tabs-kid button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px;font-size:12.5px;line-height:1.2}
.tabs-kid button .em{font-size:22px;display:block}
.tabs-kid button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.bflies{display:flex;gap:10px;margin:10px 0}
.bflies button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.bflies button[aria-pressed="true"]{border-color:var(--ink)}
.little p{font-size:19px}
.balloon-wrap{display:grid;place-items:center;height:180px}
.balloon{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),var(--blue);transition:transform 4s ease-in-out}
.balloon.in{transform:scale(1.8)}
.breath-label{font-family:var(--display);font-size:22px;text-align:center;min-height:32px}

/* after */
.faces{display:flex;justify-content:space-between;gap:4px;margin:8px 0 12px}
.faces button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;font-size:22px}
.faces button[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft)}
.toggle-row{display:flex;gap:8px;margin:6px 0 12px}
.toggle-row button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px}
.toggle-row button[aria-pressed="true"]{background:var(--sage);color:#fff;border-color:var(--sage)}
.alert{background:var(--alert-soft);border:2px solid var(--alert);border-radius:18px;padding:16px;margin-bottom:14px}
.alert h3{color:var(--alert)}
.alert ul{margin:6px 0 12px;padding-inline-start:20px}
.food{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food div{border-radius:14px;padding:12px;font-size:14.5px}
.food .yes{background:var(--sage-soft)}
.food .no{background:var(--alert-soft)}
.log{list-style:none;padding:0;margin:8px 0 0;font-size:14.5px}
.log li{border-top:1px solid var(--line);padding:8px 0}

/* ask */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper)}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.bot .src{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.msg.urgent{background:var(--alert-soft);border:2px solid var(--alert)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;text-align:start}
.ask-row{display:flex;gap:8px}
.ask-row input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}

/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){nav{position:sticky;transform:none;left:auto;bottom:0}}
nav[hidden]{display:none}
nav button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--muted);border-radius:12px}
nav button .em{font-size:20px}
nav button[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--sky)}

/* setup */
.stepper{display:flex;gap:6px;margin:4px 0 16px}
.stepper span{flex:1;height:6px;border-radius:6px;background:var(--line)}
.stepper span.on{background:var(--sage)}
.pick{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:start;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px}
.opt b{font-family:var(--display);font-size:18px}
.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft)}
.opt[disabled]{opacity:.5;cursor:default}
.team{display:grid;grid-template-columns:1fr;gap:10px}
.doc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.doc .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--sky);flex:none}
.doc b{font-family:var(--display);font-size:17px;display:block}
.doc small{color:var(--muted);display:block;margin-bottom:4px}
.instr{border-inline-start:5px solid var(--yellow);background:#FFF8E6;border-radius:12px;padding:12px 14px;margin:0 0 14px;color:#4A3A00}
:root[data-theme="dark"] .instr{background:#33290F;color:#F2E2B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .instr{background:#33290F;color:#F2E2B0}}
.instr b{display:block}
.linkbtn{border:none;background:none;color:var(--sage);text-decoration:underline;padding:0;font-size:14px}
@media (prefers-reduced-motion:reduce){.balloon{transition:none}}
</style>
</head>

  <header class="top">
    <div class="brand" id="brand"></div>
    <button class="lang" id="langBtn" type="button"></button>
  </header>
  <div class="proto" id="proto"></div>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>

    <section class="block${a===0?" little":""}" id="kblock">${a===0?`<p><button class="btn ghost" type="button" id="readBtn">${X[st.lang].read}</button></p>`:""}${inner}</section>`; }

function monitorHTML(force){ const on = force || st.leads.length===3, ox=st.finger;
  return `<div class="monitor"><div class="mon-top"><span>ECG</span><span>${on?'<span class="hr">'+fa(hrNow())+'</span> bpm':'--'}</span></div><div class="mon-top" style="font-size:11.5px;opacity:.8"><span>${X[st.lang].hrLbl}</span><span>${fa(hrRange()[0])}–${fa(hrRange()[1])}</span></div><canvas id="ecg" data-on="${on?1:0}" width="600" height="140"></canvas>
  <div class="mon-top"><span>SpO₂ · Pleth</span><span>${ox?'<span class="hr" style="color:#4FC3F7">'+fa(99)+'</span> %':'--'}</span></div><canvas id="pleth" data-on="${ox?1:0}" width="600" height="100"></canvas></div>`; }

function after(){ const t=T(); const faces=["😀","🙂","😐","🙁","😣","😭"];
  return `<h1>${t.afterTitle}</h1>
  <section class="alert" role="region" aria-label="${t.alertTitle}"><h3>${t.alertTitle}</h3><ul>${L(SU().alerts).map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn" type="button" style="background:var(--alert)">${t.alertBtn}</button></section>
  <section class="block"><h2>${t.checkTitle}</h2><p class="muted">${t.checkSub}</p>
    <h3>${t.pain}</h3><div class="faces">${faces.map((f,i)=>`<button type="button" data-face="${i}" aria-pressed="${st.face===i}" aria-label="${fa(i*2)}/10">${f}</button>`).join("")}</div>
    <h3>${L(SU().q2)}</h3><div class="toggle-row">${["yes","some","no"].map(k=>`<button type="button" data-drink="${k}" aria-pressed="${st.drink===k}">${t[k]}</button>`).join("")}</div>
    <h3>${t.sleep}</h3><div class="toggle-row">${["yes","some","no"].map(k=>`<button type="button" data-sleep="${k}" aria-pressed="${st.sleep===k}">${t[k]}</button>`).join("")}</div>
    <button class="btn" type="button" id="saveCheck">${t.save}</button>
    ${st.logs.length?`<h3 style="margin-top:14px">${t.logTitle}</h3><ul class="log">${st.logs.map(l=>`<li>${faces[l.face]??"–"} · ${L(SU().q2).replace(/[?؟]/,"")}: ${t[l.drink]??"–"} · ${t.sleep.replace("?","")}: ${t[l.sleep]??"–"}</li>`).join("")}</ul><p class="note">${t.logged}</p>`:""}
  </section>
  <section class="block"><h2>${L(SU().careTitle)}</h2><div class="food"><div class="yes">${L(SU().yes)}</div><div class="no">${L(SU().no)}</div></div><p class="note">${t.foodNote}</p></section>`; }

function ask(){ const t=T(); return `<h1>${t.askTitle}</h1><p class="muted">${t.askSub}</p>
  <div class="chat" aria-live="polite">${st.chat.map(m=>m.who==="me"?`<div class="msg me">${m.text}</div>`:`<div class="msg bot ${m.urgent?"urgent":""}">${m.text}${m.urgent?"":`<span class="src">${t.src}</span>`}</div>`).join("")}</div>
  <div class="chips">${t.chips.map((c,i)=>`<button type="button" data-chip="${i}">${c}</button>`).join("")}</div>
  <form class="ask-row" id="askForm"><input id="q" placeholder="${t.placeholder}" aria-label="${t.placeholder}"><button class="btn" type="submit">${t.send}</button></form>`; }

function answer(q){ const t=T(); const s=q.toLowerCase();
  if(/blood|bleed|خون/.test(s)) return {text:t.urgent, urgent:true};
  if(/after|eat after|بعد/.test(s)&&/eat|food|غذا|بخور/.test(s)) return {text:L(SU().eat)};
  if(/stop|fast|before|ناشتا|از کی|قبل/.test(s)) return {text: X[st.lang].protocol+": "+X[st.lang].protoFast(fa(C().solids),fa(C().fluids))+" "+(st.lang==="en"?"The fasting planner on 'Get ready' works out the exact times for you.":"برنامه‌ریز ناشتایی در بخش «آمادگی» زمان دقیق را برایتان حساب می‌کند.")};
  if(/eat|food|drink|غذا|بخور|نوش/.test(s)) return {text:L(SU().eat)};
  if(/pain|hurt|درد/.test(s)) return {text:L(SU().pain)};
  return {text:t.answers.unknown};
}

function render(){
  cancelAnimationFrame(raf);
  renderChrome();
  if(!(st.welcome||st.setup>0) && !st.role) st.tab="home";
  let v= (st.welcome||st.setup>0) ? setup() : {home,prep,kid,after,ask}[st.tab]();
  if(!(st.welcome||st.setup>0) && st.role) v=`<p style="margin:0 0 10px"><button class="linkbtn" type="button" id="toRoles">${st.lang==="fa"?"→":"←"} ${X[st.lang].toRoles}</button></p>`+v;
  $("main").innerHTML=v;
  const c=$("ecg"); if(c) drawECG(c);
}

function drawECG(c){
  const ctx=c.getContext("2d"), W=c.width, H=c.height, on=c.dataset.on==="1";
  const pc=$("pleth"), pctx=pc&&pc.getContext("2d"), pon=pc&&pc.dataset.on==="1";
  const P=Math.round(150*92/hrNow());
  const pl=x=>{ const t=(x%P)/P; if(t<.18) return -34*Math.sin(t/.18*Math.PI/2); const d=t-.18; return -34*Math.exp(-d*3.2)*(1+.18*Math.sin(d*28)); };
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const beat=x=>{ const p=x%P; if(p<10) return 0; if(p<16) return -8; if(p<20) return 4; if(p<26) return -62; if(p<32) return 30; if(p<40) return 0; if(p<62) return -12*Math.sin((p-40)/22*Math.PI); return 0; };
  let off=0;
  const frame=()=>{
    ctx.clearRect(0,0,W,H); ctx.lineWidth=3; ctx.strokeStyle=on?"#5BE38A":"#3a5a52"; ctx.beginPath();
    for(let x=0;x<W;x++){ const y=H/2+(on?beat(x+off):0); x?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
    if(pctx){ const PW=pc.width, PH=pc.height; pctx.clearRect(0,0,PW,PH); pctx.lineWidth=3; pctx.strokeStyle=pon?"#4FC3F7":"#2f4a55"; pctx.beginPath();
      for(let x=0;x<PW;x++){ const y=PH*.75+(pon?pl(x+off):0); x?pctx.lineTo(x,y):pctx.moveTo(x,y); } pctx.stroke(); }
    off+=3; if(!reduce && (on||pon)) raf=requestAnimationFrame(frame);
  }; frame();
}

let breathTimer=null;
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="langBtn"){ st.lang=st.lang==="en"?"fa":"en"; st.chat=[]; render(); return; }
  if(b.dataset.centre){ if(st.centre!==b.dataset.centre){st.centre=b.dataset.centre; st.surgeon=null; st.surg=null;} render(); return; }
  if(b.dataset.role){ st.role=b.dataset.role; st.tab= st.role==="parent"?"prep":"kid"; render(); $("main").scrollTop=0; return; }
  if(b.id==="toRoles"){ st.role=null; st.tab="home"; render(); return; }
  if(b.id==="fingerBtn"){ st.finger=!st.finger; render(); return; }
  if(b.id==="readBtn"){ const el=document.querySelector("#kblock p:not(:first-child)"); if(el && "speechSynthesis" in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(el.textContent); u.lang= st.lang==="fa"?"fa-IR":"en-US"; u.rate=.9; speechSynthesis.speak(u);} return; }
  if(b.id==="backWelcome"){ st.welcome=true; render(); return; }
  if(b.id==="exitBtn"){ st.welcome=true; st.setup=1; st.tab="home"; st.role=null; render(); return; }
  if(b.id==="goBtn"){ st.welcome=false; st.setup=1; render(); return; }
  if(b.dataset.surgeon){ if(st.surgeon!==b.dataset.surgeon){st.surgeon=b.dataset.surgeon; st.surg=null;} render(); return; }
  if(b.dataset.surg){ st.surg=b.dataset.surg; render(); return; }
  if(b.dataset.setup!==undefined){
    if(st.setup===1 && $("cage")){ const nm=$("cname").value.trim()||"Ali", ag=+$("cage").value, w=+$("cweight").value;
      if(!(ag>=1&&ag<=17)||!(w>0)){ $("cerr").textContent=X[st.lang].need; return; }
      st.child={name:nm.replace(/</g,""),age:ag,weight:w}; st.age= ag<=5?0: ag<=9?1:2; }
    st.setup=+b.dataset.setup; if(st.setup===0) st.tab="home"; render(); $("main").scrollTop=0; return; }
  if(b.dataset.tab){ st.tab=b.dataset.tab; render(); $("main").scrollTop=0; return; }
  if(b.dataset.age){ st.age=+b.dataset.age; render(); return; }
  if(b.dataset.ktab){ st.ktab=b.dataset.ktab; clearInterval(breathTimer); render(); return; }
  if(b.dataset.lead){ const k=b.dataset.lead; if(!st.leads.includes(k)) st.leads.push(k); else st.leads=st.leads.filter(x=>x!==k); render(); return; }
  if(b.dataset.bfly){ st.bfly=b.dataset.bfly; render(); return; }
  if(b.dataset.face){ st.face=+b.dataset.face; render(); return; }
  if(b.dataset.drink){ st.drink=b.dataset.drink; render(); return; }
  if(b.dataset.sleep){ st.sleep=b.dataset.sleep; render(); return; }
  if(b.id==="saveCheck"){ st.logs.unshift({face:st.face,drink:st.drink,sleep:st.sleep}); st.face=st.drink=st.sleep=null; render(); return; }
  if(b.dataset.chip){ const q=T().chips[+b.dataset.chip]; st.chat.push({who:"me",text:q}); st.chat.push(answer(q)); render(); return; }
  if(b.id==="breathBtn"){ const bal=$("balloon"), lab=$("blabel"); let inhale=true, n=0; clearInterval(breathTimer);
    const step=()=>{ bal.classList.toggle("in",inhale); lab.textContent=inhale?T().in:T().out; inhale=!inhale; if(++n>6){clearInterval(breathTimer); bal.classList.remove("in"); lab.textContent="✨";} };
    step(); breathTimer=setInterval(step,4000); }
});
document.addEventListener("submit",e=>{ if(e.target.id==="askForm"){ e.preventDefault(); const q=$("q").value.trim(); if(!q) return; st.chat.push({who:"me",text:q.replace(/</g,"&lt;")}); st.chat.push(answer(q)); render(); }});
document.addEventListener("change",e=>{ if(e.target.id==="stime" && e.target.value){ st.time=e.target.value; render(); } });
document.addEventListener("input",e=>{ if(e.target.id==="stime" && e.target.value){ st.time=e.target.value; const p=document.querySelectorAll(".fast b"); p[0].textContent=shift(st.time,C().solids); p[1].textContent=shift(st.time,C().fluids); }});
render();
</script>
</body>
</html>
